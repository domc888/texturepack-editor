name: Build JAR

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK version to use'
        required: true
        default: '17'
  push:
    branches:
      - gng

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk_version || '17' }}

      - name: Build (Gradle / Maven / javac fallback)
        id: build
        run: |
          set -euo pipefail

          # Prefer project root (repo root) since you unzipped the sources
          ROOT="$(pwd)"
          echo "Project root: $ROOT"
          cd "$ROOT"

          # Gradle wrapper (preferred)
          if [ -x "./gradlew" ]; then
            echo "Using Gradle wrapper"
            # Try shadowJar first (fat jar) then fallback to assemble
            ./gradlew --no-daemon clean shadowJar assemble || ./gradlew --no-daemon clean assemble
            exit 0
          fi

          # Gradle (system)
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Using Gradle (system)"
            gradle --no-daemon clean shadowJar assemble || gradle --no-daemon clean assemble || true
            exit 0
          fi

          # Maven
          if [ -f "pom.xml" ]; then
            echo "Using Maven"
            mvn -B -DskipTests clean package
            exit 0
          fi

          # Plain Java fallback
          echo "No Gradle/Maven files found — using javac fallback"
          # Find Java sources (prefer src/main/java)
          SRC_DIR=""
          if [ -d "src/main/java" ]; then
            SRC_DIR="src/main/java"
          else
            # first directory that contains .java files
            SRC_DIR=$(find . -type f -name '*.java' -printf '%h\n' | sort -u | head -n 1 || true)
          fi

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: No Java sources found."
            find . -maxdepth 3 -print | sed -n '1,200p'
            exit 1
          fi

          echo "Compiling Java sources from: $SRC_DIR"
          mkdir -p out/classes
          find "$SRC_DIR" -name '*.java' > java_files.list
          javac -d out/classes @java_files.list
          mkdir -p out/libs
          (cd out/classes && jar cf ../libs/app.jar .)
          echo "Created jar: $(pwd)/out/libs/app.jar"

      - name: Locate produced JAR(s)
        id: collect_jars
        run: |
          set -euo pipefail
          # find all non-source/javadoc jars produced in repo (limit to 50)
          JARS=$(find . -type f -name '*.jar' \
            -not -iname '*sources*.jar' -not -iname '*javadoc*.jar' \
            -not -path './.gradle/*' -not -path './**/.gradle/*' \
            | sed 's|^\./||' | head -n 50 || true)

          if [ -z "$JARS" ]; then
            echo "No JARs were produced. Listing common output directories for debugging:"
            ls -la build/libs || true
            ls -la target || true
            ls -la out/libs || true
            exit 1
          fi

          echo "Found JARs:"
          echo "$JARS"
          # set output for upload step (newline-separated list is supported)
          echo "jars<<EOF" >> $GITHUB_OUTPUT
          echo "$JARS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: ${{ steps.collect_jars.outputs.jars }}
