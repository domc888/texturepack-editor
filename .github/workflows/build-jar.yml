name: Build JAR

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK version to use'
        required: true
        default: '25'
  push:
    branches:
      - gng
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk_version || '25' }}

      - name: Build jar
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: |
            build/libs/*.jar
