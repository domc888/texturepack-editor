      - name: Locate Gradle Wrapper
        shell: bash
        run: |
          WRAPPER=$(find "$PROJECT_DIR" -type f -name gradle-wrapper.properties -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradle-wrapper.properties is missing from the repository."
            echo "The project must include its Gradle wrapper configuration or use an installed Gradle version."
            exit 1
          fi

          WRAPPER_DIR=$(dirname "$WRAPPER")
          PROJECT_DIR=$(dirname "$(dirname "$(dirname "$WRAPPER")")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "WRAPPER_DIR=$WRAPPER_DIR" >> "$GITHUB_ENV"
