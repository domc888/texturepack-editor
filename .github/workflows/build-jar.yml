
name: Build Pack Editor Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle
          cache-dependency-path: packeditor/*.gradle*

      - name: Build mod
        working-directory: packeditor
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: PackEditor-26.2
          path: |
            packeditor/build/libs/*.jar
            !packeditor/build/libs/*-sources.jar
          if-no-files-found: error
