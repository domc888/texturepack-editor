name: Build Pack Editor Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find Gradle project
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew found in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
          cache-disabled: true

      - name: Restore Gradle wrapper JAR
        shell: bash
        run: |
          PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          WRAPPER_JAR="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"

          if [ ! -f "$PROPERTIES" ]; then
            echo "WARNING: gradle-wrapper.properties is missing."
            echo "The build will use the installed Gradle version instead."
            exit 0
          fi

          VERSION=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' "$PROPERTIES")

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine Gradle version."
            exit 1
          fi

          mkdir -p "$(dirname "$WRAPPER_JAR")"

          if [ ! -s "$WRAPPER_JAR" ]; then
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/v${VERSION}/gradle/wrapper/gradle-wrapper.jar" \
              -o "$WRAPPER_JAR"
          fi

          if [ ! -s "$WRAPPER_JAR" ]; then
            echo "ERROR: Could not restore gradle-wrapper.jar."
            exit 1
          fi

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew clean build --no-daemon --stacktrace
          else
            gradle clean build --no-daemon --stacktrace
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: PackEditor-26.2
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
