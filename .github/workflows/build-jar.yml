
name: Build Pack Editor Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find Gradle project
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew found in the repository."
            echo "Make sure you uploaded the Gradle wrapper files."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: PackEditor-26.2
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
