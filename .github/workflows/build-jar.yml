name: Build mod JAR

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK version to use (project requires Java 25)'
        required: true
        default: '25'
  push:
    branches:
      - gng

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk_version || '25' }}

      - name: Build with Gradle (wrapper if healthy, otherwise install gradle)
        run: |
          set -euo pipefail

          # Prefer wrapper when the wrapper JAR is present
          if [ -x "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Using gradle wrapper"
            ./gradlew --no-daemon clean build
            exit 0
          fi

          # If gradlew exists but wrapper JAR is missing, or no wrapper at all, install system gradle and run it
          echo "Gradle wrapper not usable or missing; installing system gradle and using that"
          sudo apt-get update -y
          sudo apt-get install -y unzip zip gradle

          # Run gradle (system)
          gradle --no-daemon clean build

      - name: Upload JAR artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: packeditor-jars
          path: build/libs/*.jar
